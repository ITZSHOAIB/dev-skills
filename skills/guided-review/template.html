<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guided review</title>
<style>
:root{color-scheme:light dark;--bg:var(--background,Canvas);--fg:var(--foreground,CanvasText);--bd:var(--border,#8884);--mut:var(--muted-foreground,#888)}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;max-width:860px}
h1{font-size:18px;margin:0 0 2px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:20px 0 6px}
a{color:inherit}.mut{color:var(--mut);font-size:12px}p{margin:4px 0}
.card{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin:8px 0}
.card.approve{border-color:#2a9d4a}.card.dismiss{opacity:.55}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sev{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--bd)}
.sev.blocking{border-color:#d33;color:#d33}.sev.should-fix{border-color:#c80;color:#c80}
button{font:inherit;padding:3px 12px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:inherit;cursor:pointer}
button[aria-pressed=true].a{background:#2a9d4a;color:#fff;border-color:#2a9d4a}
button[aria-pressed=true].d{background:var(--mut);color:var(--bg)}
textarea{width:100%;box-sizing:border-box;margin-top:6px;font:inherit;background:transparent;color:inherit;border:1px solid var(--bd);border-radius:6px;padding:6px;min-height:34px;resize:vertical}
pre{white-space:pre-wrap;word-break:break-word;border:1px solid var(--bd);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,monospace;margin:6px 0}
summary{cursor:pointer;color:var(--mut);font-size:12px;margin-top:4px}code{font:12px ui-monospace,monospace}
</style></head><body>
<h1 id="title"></h1><div class="mut" id="meta"></div>
<h2>Problem</h2><p id="problem"></p>
<h2>How this PR solves it</h2><p id="how"></p>
<div id="swrap"><h2>Shape of the change</h2><pre id="shape"></pre></div>
<p class="mut" id="verified"></p>
<h2>Findings <span class="mut" id="count"></span></h2><div id="findings"></div>
<div id="qwrap"><h2>Questions for you</h2><div id="questions"></div></div>
<h2>Anything else for the implementor?</h2><textarea id="overall" placeholder="Optional"></textarea>
<h2>Prompt for the implementor <span class="mut" id="pstate"></span></h2>
<pre id="prompt"></pre><button id="copy">Copy prompt</button>
<script type="application/json" id="data">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById("data").textContent),$=id=>document.getElementById(id);
const KEY="guided-review:"+(D.pr.url||D.pr.title);let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
S.f=S.f||{};S.q=S.q||{};S.overall=S.overall||"";
$("title").textContent=D.pr.title;
$("meta").textContent=`${D.pr.head} → ${D.pr.base}${D.pr.size?" · "+D.pr.size:""}`;
if(D.pr.url){const a=el("a",null,"  open PR");a.href=D.pr.url;$("meta").append(a)}
$("problem").textContent=D.problem;$("how").textContent=D.how;$("verified").textContent=D.verified||"";
if(D.shape)$("shape").textContent=D.shape;else $("swrap").hidden=true;
if(!(D.questions||[]).length)$("qwrap").hidden=true;
const cards={};
D.findings.forEach(f=>{
  const s=S.f[f.id]=S.f[f.id]||{d:"",c:""},c=el("div","card");cards[f.id]=c;
  const top=el("div","row");top.append(el("b",null,f.id),el("span","sev "+f.sev,f.sev),el("code",null,f.where));
  const a=el("button","a","Approve"),d=el("button","d","Dismiss");
  const set=v=>{s.d=s.d===v?"":v;paint();save();build()};a.onclick=()=>set("approve");d.onclick=()=>set("dismiss");
  top.append(a,d);
  const det=el("details"),sm=el("summary",null,"Scenario and fix");
  det.append(sm,el("p",null,"Scenario: "+f.scenario),el("p",null,"Fix: "+f.fix));
  if(f.shape)det.append(el("pre",null,f.shape));
  const t=el("textarea");t.placeholder="Your comment (optional)";t.value=s.c;t.oninput=()=>{s.c=t.value;save();build()};
  c.append(top,el("p",null,f.defect),det,t);$("findings").append(c);
  function paint(){c.className="card "+s.d;a.setAttribute("aria-pressed",s.d==="approve");d.setAttribute("aria-pressed",s.d==="dismiss")}
  paint();
});
const qs=[];(D.questions||[]).forEach(q=>{
  const t=el("textarea");t.value=S.q[q.id]||"";t.placeholder="Your answer";
  t.oninput=()=>{S.q[q.id]=t.value;save();build()};
  const w=el("div","card");w.append(el("p",null,q.id+" · "+q.text),t);$("questions").append(w);
});
$("overall").value=S.overall;$("overall").oninput=e=>{S.overall=e.target.value;save();build()};
function build(){
  const ok=D.findings.filter(f=>S.f[f.id].d==="approve"),und=D.findings.filter(f=>!S.f[f.id].d).length;
  $("count").textContent=`${ok.length} approved · ${D.findings.length-ok.length-und} dismissed · ${und} undecided`;
  $("pstate").textContent=und?`(${und} undecided are left out)`:"";
  const L=[];
  if(!ok.length){L.push(`Review of ${D.pr.title} (branch ${D.pr.head}): no changes requested.`)}
  else{
    L.push(`Address review items on ${D.pr.title} (branch ${D.pr.head}) in ${D.repo}. Change nothing beyond the items below. Follow the repo's AGENTS.md.`,"");
    ok.forEach(f=>{L.push(`${f.id} [${f.sev}] ${f.where}`,`  Problem: ${f.defect}`,`  Change: ${f.fix}`);
      if(f.shape)L.push("  Shape:",...f.shape.split("\n").map(l=>"    "+l));
      if(f.test)L.push(`  Test first: ${f.test}`);
      if(S.f[f.id].c.trim())L.push(`  Reviewer note (takes priority): ${S.f[f.id].c.trim()}`);L.push("")});
    const qa=(D.questions||[]).filter(q=>(S.q[q.id]||"").trim());
    if(qa.length){L.push("Reviewer answers:");qa.forEach(q=>L.push(`  ${q.id} (${q.text}): ${S.q[q.id].trim()}`));L.push("")}
    if(S.overall.trim())L.push("Also: "+S.overall.trim(),"");
    L.push(`Run: ${D.commands}. Commit with a conventional message and push to the same branch.`);
  }
  $("prompt").textContent=L.join("\n");
}
$("copy").onclick=async()=>{const t=$("prompt").textContent;
  try{await navigator.clipboard.writeText(t)}catch{const r=document.createRange();r.selectNodeContents($("prompt"));const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand("copy")}
  $("copy").textContent="Copied";setTimeout(()=>$("copy").textContent="Copy prompt",1500)};
build();
</script></body></html>
